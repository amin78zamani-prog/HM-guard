workflows:
  android-debug-workflow:
    name: Android Debug Build
    max_build_duration: 15
    environment:
      java: 17
    scripts:
      - name: Clean project
        script: ./gradlew clean
      - name: Build Debug APK
        script: ./gradlew assembleDebug --offline
    artifacts:
      - app/build/outputs/apk/debug/*.apk
